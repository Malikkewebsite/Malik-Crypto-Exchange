<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malik Crypto Exchange</title>
    <style>
        body { background: #14151a; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 10px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1e2329; padding: 10px; border-radius: 8px; }
        .btn { padding: 8px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .container { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
        .card { background: #1e2329; padding: 15px; border-radius: 8px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; background: #14151a; color: #fff; border: 1px solid #474d57; border-radius: 4px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #2b313a; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div>
            <h3 style="margin: 0;">⚡ Malik Crypto</h3>
            <small id="user-uid">UID: Loading...</small>
        </div>
        <div>
            <span style="font-weight: bold; color: #0ecb81;" id="header-balance">USDT Balance: 0.00</span>
        </div>
        <div>
            <button class="btn" style="background: #0ecb81;" onclick="openDeposit()">Deposit</button>
            <button class="btn" style="background: #f6465d;" onclick="openWithdraw()">Withdraw</button>
            <button class="btn" style="background: #f0b90b; color: #000;" onclick="openAdmin()">Admin Panel</button>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h4>Spot Trading (<span id="active-symbol">BTCUSDT</span>)</h4>
            <label>Order Type</label>
            <select id="order-type">
                <option value="market">Market Order</option>
                <option value="limit">Limit Order</option>
            </select>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <label>Amount / Quantity</label>
                <button type="button" onclick="setMaxHoldings()" style="background: #f0b90b; border: none; padding: 3px 10px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 12px; color: #000;">MAX</button>
            </div>
            <input type="number" id="trade-amount" placeholder="Enter amount..." />

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn" style="flex: 1; background: #0ecb81; color: white;" onclick="executeTrade('BUY')">BUY / LONG</button>
                <button class="btn" style="flex: 1; background: #f6465d; color: white;" onclick="executeTrade('SELL')">SELL / SHORT</button>
            </div>
        </div>

        <div class="card">
            <h4>My Holdings</h4>
            <table>
                <thead>
                    <tr><th>Symbol</th><th>Amount</th><th>Avg Price</th></tr>
                </thead>
                <tbody id="holdings-table">
                    <tr><td colspan="3">No holdings found</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h4>Recent Trades</h4>
            <table>
                <thead>
                    <tr><th>ID</th><th>Side</th><th>Price</th><th>Amount</th></tr>
                </thead>
                <tbody id="trades-table">
                    <tr><td colspan="4">No trades found</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentUID = localStorage.getItem('uid');

        async function initUser() {
            const res = await fetch('/api/user/init', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid: currentUID })
            });
            const data = await res.json();
            if(data.success) {
                currentUID = data.uid;
                localStorage.setItem('uid', currentUID);
                document.getElementById('user-uid').innerText = 'UID: ' + currentUID;
                loadPortfolio();
            }
        }

        async function loadPortfolio() {
            if(!currentUID) return;
            const res = await fetch(`/api/user/portfolio/${currentUID}`);
            const data = await res.json();
            if(data.success) {
                document.getElementById('header-balance').innerText = `USDT Balance: ${data.wallet.usdt_balance.toFixed(2)}`;
                
                // Render Holdings
                const hTable = document.getElementById('holdings-table');
                hTable.innerHTML = '';
                if(data.holdings && data.holdings.length > 0) {
                    data.holdings.forEach(h => {
                        hTable.innerHTML += `<tr><td>${h.symbol}</td><td>${h.amount}</td><td>${h.avgPrice || 0}</td></tr>`;
                    });
                } else {
                    hTable.innerHTML = `<tr><td colspan="3">No holdings found</td></tr>`;
                }

                // Render Trades
                const tTable = document.getElementById('trades-table');
                tTable.innerHTML = '';
                if(data.trades && data.trades.length > 0) {
                    data.trades.forEach(t => {
                        tTable.innerHTML += `<tr><td>${t.id}</td><td style="color:${t.side==='BUY'?'#0ecb81':'#f6465d'}">${t.side}</td><td>${t.price}</td><td>${t.amount}</td></tr>`;
                    });
                } else {
                    tTable.innerHTML = `<tr><td colspan="4">No trades found</td></tr>`;
                }
            }
        }

        // Max Button Functionality
        async function setMaxHoldings() {
            const symbol = document.getElementById('active-symbol').innerText;
            const res = await fetch(`/api/user/portfolio/${currentUID}`);
            const data = await res.json();
            if(data.success) {
                const holding = (data.holdings || []).find(h => h.symbol === symbol);
                if(holding && holding.amount > 0) {
                    document.getElementById('trade-amount').value = holding.amount;
                } else {
                    alert('No holdings found for ' + symbol);
                }
            }
        }

        async function executeTrade(side) {
            const symbol = document.getElementById('active-symbol').innerText;
            const type = document.getElementById('order-type').value;
            const amount = document.getElementById('trade-amount').value;

            if(!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            const res = await fetch('/api/trade/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid: currentUID, symbol, side, type, amount })
            });
            const data = await res.json();
            alert(data.message);
            loadPortfolio();
        }

        function openDeposit() {
            let amt = prompt('Enter Deposit Amount (USDT):');
            if(amt && amt > 0) {
                fetch('/api/deposit/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid: currentUID, amount: parseFloat(amt) })
                }).then(res => res.json()).then(data => alert(data.message));
            }
        }

        function openWithdraw() {
            let amt = prompt('Enter Withdrawal Amount (USDT):');
            let addr = prompt('Enter TRC20 Wallet Address:');
            if(amt && addr) {
                fetch('/api/withdraw/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid: currentUID, amount: parseFloat(amt), address: addr })
                }).then(res => res.json()).then(data => alert(data.message));
            }
        }

        function openAdmin() {
            let pwd = prompt('Enter Admin Password:');
            if(pwd) {
                window.location.href = `/admin.html?pwd=${encodeURIComponent(pwd)}`;
            }
        }

        initUser();
    </script>
</body>
</html>
