<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malik Crypto Exchange - Real Trading</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #12141c; color: #fff; padding: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1e222d; padding: 15px; border-radius: 8px; }
        h1 { font-size: 18px; color: #f0b90b; }
        .balance { font-size: 16px; font-weight: bold; color: #0ecb81; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; }
        .btn-deposit { background: #0ecb81; }
        .btn-withdraw { background: #f6465d; }
        .btn-admin { background: #f0b90b; color: #000; }
        .market-section, .trade-section, .portfolio-section { background: #1e222d; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        h2 { font-size: 15px; margin-bottom: 10px; color: #b2b5be; }
        select, input { width: 100%; padding: 10px; background: #2a2e39; border: 1px solid #363c4e; color: #fff; border-radius: 6px; margin-bottom: 10px; }
        .trade-btns { display: flex; gap: 10px; }
        .btn-buy { background: #0ecb81; }
        .btn-sell { background: #f6465d; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #2a2e39; }
        th { color: #b2b5be; }
        
        /* Custom Modern Modal Popup */
        #customModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: #1e222d; padding: 25px; border-radius: 12px; width: 85%; max-width: 350px; text-align: center; border: 1px solid #2a2e39; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>⚡ Malik Crypto Exchange</h1>
            <small id="uidDisplay" style="color: #848e9c; font-size: 11px;"></small>
        </div>
        <div class="balance" id="usdtBalance">USDT Balance: $0.00</div>
    </header>

    <div class="btn-group">
        <button class="btn-deposit" onclick="openDepositModal()">Deposit</button>
        <button class="btn-withdraw" onclick="openWithdrawModal()">Withdraw</button>
        <button class="btn-admin" onclick="openAdminModal()">Admin Panel</button>
    </div>

    <!-- Market & Trading Section -->
    <div class="market-section">
        <h2>Bitget Spot Markets</h2>
        <select id="marketSelect" onchange="updateSelectedMarket()"></select>
        <div id="marketPrice" style="font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #0ecb81;">Loading price...</div>
    </div>

    <div class="trade-section">
        <h2>Execute Trade (2% Fee)</h2>
        <input type="number" id="tradeAmount" placeholder="Enter amount in USDT" />
        <div class="trade-btns">
            <button class="btn-buy" onclick="executeTrade('BUY')">BUY / LONG</button>
            <button class="btn-sell" onclick="executeTrade('SELL')">SELL / SHORT</button>
        </div>
    </div>

    <!-- Portfolio Section -->
    <div class="portfolio-section">
        <h2>My Holdings & P&L Summary</h2>
        <p id="pnlSummary" style="font-size: 13px; color: #b2b5be; margin-bottom: 10px;">Total Deposited: $0.00 | Withdrawn: $0.00 | Net P&L: $0.00</p>
        <table>
            <thead>
                <tr><th>Symbol</th><th>Amount</th><th>Avg Price</th></tr>
            </thead>
            <tbody id="holdingsTable">
                <tr><td colspan="3" style="text-align:center; color:#848e9c;">No holdings yet</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Custom Popup Modal -->
    <div id="customModal">
        <div class="modal-content">
            <div id="modalIcon" style="font-size: 40px; margin-bottom: 10px;">✅</div>
            <h3 id="modalTitle" style="color:#fff; margin-bottom: 10px;">Success</h3>
            <p id="modalMessage" style="color:#b2b5be; font-size: 14px; margin-bottom: 20px;"></p>
            <button onclick="closeCustomModal()" style="background:#26a69a; width:100%; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; color:#fff;">OK</button>
        </div>
    </div>

    <!-- Success Sound Effect -->
    <audio id="successSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let UID = localStorage.getItem('malik_uid');
        if (!UID) {
            UID = 'UID_' + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem('malik_uid', UID);
        }
        document.getElementById('uidDisplay').innerText = 'UID: ' + UID;

        let marketsData = [];
        let currentSymbolPrice = 0;

        function showPopup(title, message, isSuccess = true) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('modalIcon').innerText = isSuccess ? '✅' : '❌';
            
            if (isSuccess) {
                const sound = document.getElementById('successSound');
                if (sound) { sound.currentTime = 0; sound.play().catch(e => console.log(e)); }
            }
            modal.style.display = 'flex';
        }

        function closeCustomModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        async function initUser() {
            try {
                const res = await fetch('/api/user/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid: UID, initial_balance: 100.0 }) // Free starting test balance
                });
                const data = await res.json();
                if (data.success) {
                    loadPortfolio();
                }
            } catch (e) { console.error(e); }
        }

        async function fetchMarkets() {
            try {
                const res = await fetch('/api/bitget/markets');
                const data = await res.json();
                if (data.success && data.markets) {
                    marketsData = data.markets;
                    const select = document.getElementById('marketSelect');
                    select.innerHTML = '';
                    marketsData.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.symbol;
                        opt.text = m.symbol;
                        select.appendChild(opt);
                    });
                    updateSelectedMarket();
                }
            } catch (e) { console.error(e); }
        }

        function updateSelectedMarket() {
            const symbol = document.getElementById('marketSelect').value;
            const market = marketsData.find(m => m.symbol === symbol);
            if (market) {
                currentSymbolPrice = parseFloat(market.lastPr || market.close || 0);
                document.getElementById('marketPrice').innerText = `${symbol} : $${currentSymbolPrice.toFixed(4)}`;
            }
        }

        async function loadPortfolio() {
            try {
                const res = await fetch(`/api/user/portfolio/${UID}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('usdtBalance').innerText = `USDT Balance: $${data.wallet.usdt_balance.toFixed(2)}`;
                    
                    const stats = data.stats;
                    document.getElementById('pnlSummary').innerText = `Total Deposited: $${stats.totalDeposited.toFixed(2)} | Withdrawn: $${stats.totalWithdrawn.toFixed(2)} | Net P&L: $${stats.netProfitLoss.toFixed(2)}`;

                    const tbody = document.getElementById('holdingsTable');
                    tbody.innerHTML = '';
                    if (data.holdings.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#848e9c;">No holdings yet</td></tr>`;
                    } else {
                        data.holdings.forEach(h => {
                            tbody.innerHTML += `<tr><td>${h.symbol}</td><td>${h.amount.toFixed(4)}</td><td>$${h.avg_price.toFixed(4)}</td></tr>`;
                        });
                    }
                }
            } catch (e) { console.error(e); }
        }

        async function executeTrade(side) {
            const symbol = document.getElementById('marketSelect').value;
            const amount = document.getElementById('tradeAmount').value;
            if (!amount || amount <= 0) {
                showPopup('Error', 'Please enter a valid amount', false);
                return;
            }

            try {
                const res = await fetch('/api/trade/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid: UID, symbol, side, type: 'MARKET', price: currentSymbolPrice, amount: parseFloat(amount) })
                });
                const data = await res.json();
                if (data.success) {
                    showPopup('Trade Successful', data.message, true);
                    loadPortfolio();
                    document.getElementById('tradeAmount').value = '';
                } else {
                    showPopup('Trade Failed', data.message, false);
                }
            } catch (e) {
                showPopup('Error', 'Server error during trade execution', false);
            }
        }

        function openDepositModal() {
            let amt = prompt("Enter Deposit Amount in USDT:");
            if (amt && amt > 0) {
                fetch('/api/deposit/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid: UID, method: 'USDT TRC20', amount: parseFloat(amt), details: 'Manual Request' })
                }).then(res => res.json()).then(data => {
                    showPopup('Deposit Request', data.message, data.success);
                    loadPortfolio();
                });
            }
        }

        function openWithdrawModal() {
            let amt = prompt("Enter Withdrawal Amount in USDT:");
            let addr = prompt("Enter TRC20 Wallet Address:");
            if (amt && amt > 0 && addr) {
                fetch('/api/withdraw/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid: UID, address: addr, amount: parseFloat(amt) })
                }).then(res => res.json()).then(data => {
                    showPopup('Withdrawal Request', data.message, data.success);
                    loadPortfolio();
                });
            }
        }

        function openAdminModal() {
            let pwd = prompt("Enter Admin Password:");
            if (pwd) {
                fetch('/api/admin/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                }).then(res => res.json()).then(data => {
                    if (data.success) {
                        alert(`ADMIN PANEL:\nTotal Users: ${data.wallets.length}\nAdmin Profit Collected: $${data.admin_profit.toFixed(2)}\nPending Deposits: ${data.deposits.filter(d=>d.status==='Pending').length}`);
                    } else {
                        showPopup('Access Denied', data.message, false);
                    }
                });
            }
        }

        // Initialize on load
        initUser();
        fetchMarkets();
        setInterval(fetchMarkets, 10000); // Refresh markets every 10s
    </script>
</body>
</html>
